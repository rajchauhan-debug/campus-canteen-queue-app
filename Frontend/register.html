<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Campus Canteen</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🍔 Campus Canteen
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="menu.html">
                Menu
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- Register -->

    <section class="menu-page">

        <h1>Create Account 📝</h1>

        <p class="menu-subtitle">
            Join Campus Canteen
        </p>


        <div class="auth-container">

            <form id="registerForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required>

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    Create Account

                </button>

            </form>


            <p>

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <p>

                <a href="index.html">
                    Continue as Guest
                </a>

            </p>

        </div>

    </section>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const password =
                        document.getElementById(
                            "password"
                        ).value;


                    const confirmPassword =
                        document.getElementById(
                            "confirmPassword"
                        ).value;


                    if (
                        password !==
                        confirmPassword
                    ) {

                        alert(
                            "Passwords do not match."
                        );

                        return;

                    }


                    alert(
                        "Registration authentication will be connected later."
                    );

                }
            );

    </script>

</body>

</html>
