<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Canteen</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🍔 Campus Canteen
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="menu.html">
                Menu
            </a>

        </div>

    </nav>


    <!-- Login -->

    <section class="menu-page">

        <h1>Welcome Back 👋</h1>

        <p class="menu-subtitle">
            Login to your Campus Canteen account
        </p>


        <div class="auth-container">

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    Login

                </button>

            </form>


            <p>
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </p>


            <p>
                <a href="index.html">
                    Continue as Guest
                </a>
            </p>

        </div>

    </section>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    alert(
                        "Login authentication will be connected later."
                    );

                }
            );

    </script>

</body>

</html>
